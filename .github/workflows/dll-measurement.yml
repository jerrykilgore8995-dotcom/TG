name: Measure existing four-preamp Windows VST3
on:
  push:
    branches: [dll-measurement-4preamp]
    paths: [.github/workflows/dll-measurement.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve latest existing four-preamp binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifacts = gh api "repos/${{ github.repository }}/actions/artifacts?name=TG-Preamps-Preview-Windows-x64-VST3&per_page=100" | ConvertFrom-Json
          $a = $artifacts.artifacts | Where-Object { !$_.expired -and $_.workflow_run.head_branch -eq 'main' } | Sort-Object created_at -Descending | Select-Object -First 1
          if (!$a) { throw 'No nonexpired four-preamp main-branch artifact found' }
          $a | ConvertTo-Json -Depth 8 | Set-Content artifact-source.json
          gh run download $a.workflow_run.id --repo "${{ github.repository }}" --name $a.name --dir binary
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
      - run: python -m pip install pedalboard numpy
      - name: Host actual VST3 and measure
        shell: pwsh
        run: |
          @'
          import csv, json, pathlib, numpy as np
          from pedalboard import load_plugin
          bundle = next(pathlib.Path("binary").rglob("TG Type D Preview.vst3"))
          p = load_plugin(str(bundle.resolve()))
          print("Parameters:", p.parameters, flush=True)
          def param(name):
              return p.parameters[name]
          def setval(name, v):
              param(name).raw_value = float(v)
              if abs(float(param(name).raw_value)-v) > .025:
                  raise RuntimeError(f"Parameter {name} failed to set: {param(name).raw_value} vs {v}")
          assert "preamp" in p.parameters and "v72_drive" in p.parameters, "Not the four-mode binary"
          fs=44100
          n=fs
          t=np.arange(n*2)/fs
          rows=[]
          for mode,name in enumerate(["TG","1290","312","V72"]):
              setval("preamp",mode/3)
              for line in [0,1]:
                  setval("line",line)
                  for db in [-60,-40,-20,-12]:
                      for hz in [20,40,100,200,500,1000,2000,5000,10000,15000,20000]:
                          x=(10**(db/20)*np.sin(2*np.pi*hz*t)).astype(np.float32)
                          y=np.asarray(p(np.stack([x,x]),fs,buffer_size=256,reset=True))
                          z=y[0,-n:].astype(float)
                          if not np.all(np.isfinite(z)): raise RuntimeError("Nonfinite sample")
                          Y=np.fft.rfft(z)/n*2
                          X=np.fft.rfft(x[-n:].astype(float))/n*2
                          fundamental=abs(Y[hz])
                          if fundamental<1e-15: raise RuntimeError("No output")
                          hs=[abs(Y[k*hz])/fundamental if k*hz<fs/2 else None for k in range(2,21)]
                          thd=100*np.sqrt(sum(h*h for h in hs if h is not None))
                          residual=z-np.real(Y[hz]*np.exp(2j*np.pi*hz*np.arange(n)/fs))
                          thdn=100*np.sqrt(np.mean(residual**2))/(fundamental/np.sqrt(2))
                          phase=np.angle(Y[hz]/X[hz],deg=True)
                          rows.append([name,line,db,hz,20*np.log10(fundamental/abs(X[hz])),phase,thd,thdn,float(np.max(np.abs(z))),float(np.max(np.abs(y[0,-n:]-y[1,-n:]))),*[20*np.log10(max(h,1e-15)) if h is not None else "" for h in hs]])
                  print(name,"line",line,"complete",flush=True)
          with open("dll-measurements.csv","w",newline="") as f:
              w=csv.writer(f); w.writerow(["mode","line","input_peak_dbfs","hz","gain_db","phase_deg_including_latency","thd_pct_K2_K20","thdn_pct","output_peak","channel_difference_peak"]+[f"K{k}_dBc" for k in range(2,21)]); w.writerows(rows)
          for name in ["TG","1290","312","V72"]:
              print(name, [r[:10] for r in rows if r[0]==name and r[2]==-20 and r[3]==1000],flush=True)
          '@ | Set-Content -Encoding UTF8 measure.py
          python measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TG-four-preamp-DLL-measurements
          path: |
            dll-measurements.csv
            artifact-source.json
            measure.py
