name: Windows VST3 and SPICE reference
on:
  push:
  workflow_dispatch:

concurrency:
  group: tg-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reference:
    strategy:
      matrix:
        include:
          - model: type-d
            script: characterize
            header: TypeDModel.h
            report: spice-report.json
          - model: alternate
            script: characterize_extra
            header: ExtraModels.h
            report: extra-spice-report.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install -r calibration/requirements.txt
      - run: python "spice/$SCRIPT.py" --jobs 4 --header "build/generated/$MODEL_HEADER" --report "build/$MODEL_REPORT"
        env:
          OPENBLAS_NUM_THREADS: 1
          SCRIPT: ${{ matrix.script }}
          MODEL_HEADER: ${{ matrix.header }}
          MODEL_REPORT: ${{ matrix.report }}
      - uses: actions/upload-artifact@v4
        with:
          name: tg-reference-${{ matrix.model }}
          path: |
            build/generated/${{ matrix.header }}
            build/${{ matrix.report }}
  bench:
    runs-on: ubuntu-latest
    needs: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tg-reference-*
          merge-multiple: true
          path: reference
      - run: |
          g++ -O3 -std=c++20 -Iplugin -Ireference/generated spice/bench_model.cpp -o /tmp/tg-bench-model
          /tmp/tg-bench-model 176400 10 > reference/bounded-dsp.csv
      - uses: actions/upload-artifact@v4
        with:
          name: TG-Preamp-SPICE-and-DSP
          path: reference
  windows:
    runs-on: windows-latest
    needs: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tg-reference-*
          merge-multiple: true
          path: reference
      - run: cmake -S . -B build -A x64 "-DTG_MODEL_DIR=${{ github.workspace }}/reference/generated"
      - run: cmake --build build --config Release --target TG_VST3 --parallel 3
      - run: |
          $binary = Join-Path $PWD 'build/TG_artefacts/Release/VST3/TG Type D Preview.vst3/Contents/x86_64-win/TG Type D Preview.vst3'
          if (!(Test-Path $binary)) { throw 'The Windows VST3 binary is missing.' }
          $artifact = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Path $artifact
          Copy-Item 'build/TG_artefacts/Release/VST3/TG Type D Preview.vst3' $artifact -Recurse
          Copy-Item 'calibration' $artifact -Recurse
          Copy-Item 'README.md' $artifact
      - uses: actions/upload-artifact@v4
        with:
          name: TG-Preamps-Preview-Windows-x64-VST3
          path: dist
